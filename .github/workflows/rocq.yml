name: Rocq 9.3

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rocq-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node.js 24)
        with:
          persist-credentials: false

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@e89b2ded52a6e13f50162220cf5fe47290162032 # v3.8.0
        with:
          ocaml-compiler: ocaml-base-compiler.5.3.0
          opam-pin: false
          cache: false

      - name: Install Rocq and its standard library
        run: opam install --yes rocq-core.9.3.0 coq-core.9.3.0 rocq-stdlib.9.2.0

      - name: Verify toolchain versions
        run: bash ci/verify-toolchain.sh

      - name: Rebuild and kernel-check all 16 modules
        run: opam exec -- bash ci/check.sh
